# Free Supabase projects pause after about a week without activity.
# This makes one small read request every 3 days so the site stays up.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one trip
        run: |
          curl --fail --silent --show-error \
            "https://gyxymfzkpieladhsrvjk.supabase.co/rest/v1/trips?select=id&limit=1" \
            -H "apikey: sb_publishable_fbUWYULihZ6-gbwdJFlfYw_iU32U3-1"
